<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BREAKOUT — Neon Arcade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #05050f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #e0e0ff;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      display: flex;
      gap: 0;
    }

    canvas {
      display: block;
      border: 1px solid rgba(0, 255, 255, 0.25);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.15), 0 0 60px rgba(120, 0, 255, 0.1);
    }

    #ui-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      pointer-events: all;
      background: rgba(5, 5, 20, 0.88);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 12px;
      padding: 40px 60px;
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.2);
      backdrop-filter: blur(4px);
    }

    .screen.active { display: flex; }

    .screen h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00f7ff, #bf00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 12px rgba(0, 247, 255, 0.6));
    }

    .screen h2 {
      font-size: 1.6rem;
      letter-spacing: 4px;
      color: #ff2d78;
      filter: drop-shadow(0 0 8px rgba(255, 45, 120, 0.7));
    }

    .hint {
      font-size: 0.8rem;
      color: rgba(200, 200, 255, 0.55);
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.8;
    }

    .neon-btn {
      margin-top: 8px;
      padding: 10px 32px;
      background: transparent;
      border: 1px solid #00f7ff;
      border-radius: 6px;
      color: #00f7ff;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      pointer-events: all;
    }

    .neon-btn:hover {
      background: rgba(0, 247, 255, 0.12);
      box-shadow: 0 0 14px rgba(0, 247, 255, 0.5);
    }

    #name-input {
      background: rgba(0, 0, 20, 0.8);
      border: 1px solid #bf00ff;
      border-radius: 6px;
      padding: 10px 18px;
      color: #e0e0ff;
      font-family: inherit;
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-align: center;
      outline: none;
      width: 220px;
    }

    #name-input:focus { box-shadow: 0 0 12px rgba(191, 0, 255, 0.6); }

    #score-display {
      font-size: 1.4rem;
      color: #ffdd00;
      letter-spacing: 4px;
      filter: drop-shadow(0 0 6px rgba(255, 221, 0, 0.7));
    }

    #upload-section {
      position: absolute;
      bottom: 12px;
      left: 12px;
      pointer-events: all;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    #upload-label {
      cursor: pointer;
      font-size: 0.72rem;
      color: rgba(0, 247, 255, 0.5);
      letter-spacing: 1px;
      border: 1px solid rgba(0, 247, 255, 0.2);
      border-radius: 4px;
      padding: 5px 12px;
      transition: color 0.2s, border-color 0.2s;
    }

    #upload-label:hover { color: #00f7ff; border-color: rgba(0, 247, 255, 0.5); }
    #upload-file { display: none; }

    #upload-status {
      font-size: 0.68rem;
      color: rgba(200, 255, 200, 0.6);
      letter-spacing: 1px;
    }

    #pause-banner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      letter-spacing: 8px;
      color: #00f7ff;
      filter: drop-shadow(0 0 16px rgba(0, 247, 255, 0.9));
      pointer-events: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game-canvas"></canvas>

    <div id="ui-overlay">
      <!-- Start screen -->
      <div id="screen-start" class="screen active">
        <h1>Breakout</h1>
        <div class="hint">
          MOUSE or ← → to move<br>
          SPACE to launch · SPACE to pause<br>
          ESC to return to this screen
        </div>
        <button class="neon-btn" id="btn-start">PRESS SPACE OR CLICK</button>
      </div>

      <!-- Game Over screen -->
      <div id="screen-gameover" class="screen">
        <h2>GAME OVER</h2>
        <div id="score-display"></div>
        <label class="hint" for="name-input">Enter your name for the high score:</label>
        <input id="name-input" type="text" maxlength="12" placeholder="YOUR NAME" autocomplete="off" spellcheck="false">
        <button class="neon-btn" id="btn-save">SAVE SCORE</button>
      </div>

      <div id="pause-banner">PAUSED</div>
    </div>

    <div id="upload-section">
      <label id="upload-label">
        &#9654; UPLOAD BG
        <input id="upload-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" aria-label="Upload background image">
      </label>
      <span id="upload-status"></span>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
